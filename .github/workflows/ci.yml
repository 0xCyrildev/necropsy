name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Pinned, not `ubuntu-latest`: GitHub is moving that label to Ubuntu 26 on 2026-10-19, and the
    # live job parses real RPC answers with curl and python3. A runner image swap should not be the
    # reason a contract check goes red -- or, worse, silently changes what it sees.
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit, not by tag: `v5` is a moving ref, and an action's tag can be
      # repointed at a different commit without a diff anyone reads.
      # v5, verified with `gh api repos/actions/checkout/commits/v5 --jq .sha`.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # The toolchain is pinned, not "whatever the runner image happens to ship". Two reasons.
      # `-D warnings` means a lint added in a newer clippy turns CI red on a commit that did not
      # change, so the version doing the linting has to be part of the configuration. And `src/`
      # uses let-chains, which need 1.88+ while the crate's own floor is 1.90.
      # This is the exact version the tree was formatted, linted and tested with locally.
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal -c clippy -c rustfmt
          rustup default 1.97.1
          rustc --version && cargo --version && cargo clippy --version

      - name: Format
        run: cargo fmt --all --check

      # `-D warnings` is the point: the suite is green today partly because a new
      # lint cannot land quietly.
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      # `--locked` is the reason Cargo.lock is committed: the build refuses if the resolved
      # set drifts from the file in the tree, so a dependency change has to be a commit.
      - name: Build
        run: cargo build --all-targets --locked

      # All offline: the library runs against committed fixtures and a MemoryRpc, and
      # the CLI contract tests dial port 1, which refuses instantly. Nothing here can
      # reach a network, so CI cannot go red because a public RPC endpoint blinked.
      - name: Test
        run: cargo test --all-targets --locked

      # The npm layer, checked rather than assumed. Each step answers a question that would
      # otherwise only surface for a user: do the manifests agree with the crate, does the asset
      # verification catch a wrong header, and does the launcher actually exec the binary and hand
      # back its exit status?
      - name: Packaging
        run: |
          set -euo pipefail
          for f in scripts/*.mjs npm/cli/bin/necropsy.js; do node --check "$f"; done
          node scripts/check-versions.mjs
          node scripts/check-workflow-ids.mjs
          node scripts/write-manifests.mjs >/dev/null
          git diff --exit-code npm/ || {
            echo "npm manifests do not match Cargo.toml/scripts/targets.mjs -- run: node scripts/write-manifests.mjs"
            exit 1
          }

      - name: Launcher contract
        run: |
          set -euo pipefail
          cargo build --release --locked
          triple=$(rustc -vV | sed -n 's/^host: //p')
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          node scripts/verify-asset.mjs "$triple" "target/release/necropsy" "$version"

          # A negative control, and it only means something on an x86_64 host: an x86_64 ELF
          # presented as aarch64 must be rejected. Without this, a header check that always returns
          # "looks fine" would pass CI forever.
          case "$triple" in
            x86_64-unknown-linux-gnu)
              if node scripts/verify-asset.mjs aarch64-unknown-linux-gnu target/release/necropsy >/dev/null 2>&1; then
                echo "verify-asset accepted an x86_64 ELF as aarch64"; exit 1
              fi
              echo "verify-asset rejected a wrong target"
              ;;
          esac

          # A node_modules layout the way npm would build it: the launcher resolves its platform
          # package by name, so a symlink farm or a copy is the honest test, not a patched path.
          stage=$(mktemp -d)
          mkdir -p "$stage/node_modules/@0xcyrildev/necropsy-linux-x64-gnu/bin"
          cp -R npm/cli "$stage/node_modules/@0xcyrildev/necropsy"
          cp npm/linux-x64-gnu/package.json "$stage/node_modules/@0xcyrildev/necropsy-linux-x64-gnu/"
          cp target/release/necropsy "$stage/node_modules/@0xcyrildev/necropsy-linux-x64-gnu/bin/necropsy"
          chmod +x "$stage/node_modules/@0xcyrildev/necropsy-linux-x64-gnu/bin/necropsy"

          run() { NODE_PATH="$stage/node_modules" node "$stage/node_modules/@0xcyrildev/necropsy/bin/necropsy.js" "$@"; }
          run --build-info | grep -q '"tool": "necropsy"'
          rc=0; run --from-json tests/fixtures/usdc-transfer-18214590.calltracer.json 0x5b515946dc1177149f140777ac90879312b182117e3392e8e2703ed3cd697153 >/dev/null || rc=$?
          [ "$rc" -eq 4 ] || { echo "a file-only run through the wrapper must exit 4, got $rc"; exit 1; }
          rc=0; run nonsense >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "a bad command line through the wrapper must exit 2, got $rc"; exit 1; }
          echo "launcher resolves the platform package and propagates 0 / 2 / 4"

      # The declared MSRV is a promise, and a promise CI does not exercise is a lie waiting for a
      # user. 1.90 is not this crate's own floor -- edition 2024 needs only 1.85 -- it is `ruint`'s,
      # read from the vendored manifest (registry `ruint-1.20.1/Cargo.toml`:
      # `rust-version = "1.90"`), and `ruint` is the `U256` every amount in the ledger is stored
      # in. A dependency's floor is the build's floor, so the honest move is to declare it, not to
      # pin an older ruint to keep a nicer number.
      - name: MSRV
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 check --all-targets --locked
