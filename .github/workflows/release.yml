name: release

# Tag-triggered artifacts, and a dispatch path that builds the identical set while publishing
# nothing. The rehearsal matters: a release workflow whose first run is also its first test is a
# release that fails in front of everyone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Pinned by commit, like every other action here: a tag on an action can be repointed at
      # different bytes with no diff anybody reads.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The build matrix is generated from scripts/targets.mjs -- the same module that generates
      # the npm package manifests. A target that exists in CI but not in npm, or the other way
      # round, is the bug that makes a release asset impossible to install.
      # The `id` is load-bearing, and this workflow shipped without it for one commit: the job
      # output reads `steps.matrix.outputs.matrix`, and an unnamed step has no addressable outputs,
      # so the value came back empty, the matrix expanded to zero jobs, and every step still
      # reported success.
      - id: matrix
        name: Matrix
        run: node scripts/release-matrix.mjs >> "$GITHUB_OUTPUT"

      - name: Report what the matrix expanded to
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          echo "raw output: ${MATRIX:0:200}…"
          echo "length: ${#MATRIX}"
          if [ -z "$MATRIX" ]; then
            echo "::error::steps.matrix.outputs.matrix is empty — is the Matrix step's id set?"
            exit 1
          fi
          count=$(printf %s "$MATRIX" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              if (!s.trim()) { console.log(0); return; }
              console.log(JSON.parse(s).include.length);
            });')
          echo "targets: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::the generated matrix is empty, so no build job will be queued"
            exit 1
          fi
          echo "matrix-count=$count" >> "$GITHUB_OUTPUT"

      - id: version
        name: Version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [ -n "$v" ] || { echo "::error::could not read a version out of Cargo.toml"; exit 1; }
          echo "Cargo.toml says $v"
          # The tag is checked against the crate, not against a human's memory of it.
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$v"
              exit 1
            fi
          fi

  build:
    needs: plan
    strategy:
      # One target failing must not hide whether the other four built, and it must not publish.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The same pinned toolchain as ci.yml, so the bytes released are the bytes linted and tested.
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version

      # Cross toolchains come from the distro's own packages: one linker each, nothing fetched
      # from a script. qemu-user-static is here so the arm64 asset can be *executed* on an x86_64
      # runner instead of only inspected -- a header check alone cannot tell a real aarch64 binary
      # from an x86_64 one that somebody renamed.
      - name: Cross toolchain
        if: ${{ join(matrix.apt, '') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ join(matrix.apt, ' ') }}

      - name: Rust target
        if: ${{ !matrix.system }}
        run: rustup target add ${{ matrix.cargoTarget }}

      - name: Build
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.linker }}" ]; then
            key=$(echo "${{ matrix.cargoTarget }}" | tr 'a-z-' 'A-Z_')
            export "CARGO_TARGET_${key}_LINKER=${{ matrix.linker }}"
          fi
          cargo build --release --locked --target ${{ matrix.cargoTarget }}
          ls -l "target/${{ matrix.cargoTarget }}/release/necropsy"

      # The `qemu` prefix comes from the matrix rather than a conditional here, so the arm64 case is
      # declared once (in scripts/targets.mjs) instead of being re-derived from runner facts.
      - name: Verify this asset is the target it claims
        env:
          NECROPSY_QEMU: ${{ matrix.qemu }}
          CARGO_TARGET: ${{ matrix.cargoTarget }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/verify-asset.mjs "$CARGO_TARGET" "target/$CARGO_TARGET/release/necropsy" "$VERSION"

      # Written by scripts/stage-asset.mjs, not `tar`. The GNU reproducibility flags
      # (`--sort --mtime --owner --group`) are what made the archive byte-stable on Linux, and macOS
      # bsdtar rejects `--sort=name` outright -- which cost both Darwin jobs on the first two
      # rehearsals. A Node writer produces the same bytes on every runner instead of the same
      # intention on some of them, and it is testable here rather than only in CI.
      - name: Stage
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          CARGO_TARGET: ${{ matrix.cargoTarget }}
        run: |
          set -euo pipefail
          node scripts/stage-asset.mjs "target/$CARGO_TARGET/release/necropsy" stage "$VERSION" "$CARGO_TARGET"
          (cd stage && sha256sum -c "necropsy-$VERSION-$CARGO_TARGET.tar.gz.sha256")
          cp LICENSE README.md stage/
          ls -l stage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assets-${{ matrix.dir }}
          path: stage/
          if-no-files-found: error

  assemble:
    # Runs on both triggers. On a dispatch this is the rehearsal: everything except the publish.
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: assets-*
          path: dl
          merge-multiple: true

      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p dist assets
          mv dl/*.tar.gz dl/*.tar.gz.sha256 assets/
          # Read them where they are now. The first version of this line cat'd dl/*.sha256 after
          # the mv above had already emptied that directory, so the manifest came out short and
          # the count check failed for the wrong reason.
          cat assets/*.tar.gz.sha256 | sort > assets/SHA256SUMS.txt
          # Counted from scripts/targets.mjs, not hardcoded: the day a target is added, this check
          # still means "every target produced an asset".
          expected=$(node -e 'import("./scripts/targets.mjs").then(m => console.log(m.TARGETS.length))')
          found=$(wc -l < assets/SHA256SUMS.txt)
          [ "$found" -eq "$expected" ] || { echo "expected $expected target assets, found $found"; exit 1; }
          node --version
          (cd assets && sha256sum -c SHA256SUMS.txt)
          for f in assets/necropsy-*-*.tar.gz; do tar -xzf "$f" -C /tmp; done
          v="${{ needs.plan.outputs.version }}"
          for d in /tmp/necropsy-$v-*; do
            t=$(basename "$d" | sed "s/^necropsy-$v-//")
            cp "$d/necropsy" "dist/necropsy-$t"
          done
          ls -l dist assets

      - name: npm packages from these same binaries
        run: |
          set -euo pipefail
          node scripts/check-versions.mjs
          node scripts/pack-npm.mjs dist
          # One tarball per package, and the package list comes from the same module again.
          node -e 'import("./scripts/targets.mjs").then(m => console.log(["cli", ...m.TARGETS.map(x => x.dir)].join("\n")))' | while read -r dir; do
            test -f "npm/$dir/package.json" || { echo "missing npm/$dir/package.json"; exit 1; }
            (cd "npm/$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/assets")
          done
          ls assets/*.tgz | wc -l
          # The tarballs join the checksum manifest, which is then verified as a whole.
          (cd assets && find . -maxdepth 1 -name '*.tgz' -print0 | xargs -0 sha256sum >> SHA256SUMS.txt && sort -o SHA256SUMS.txt SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          ls -l assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: assets/
          if-no-files-found: error

  publish:
    needs: [plan, assemble]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: assets

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          (cd assets && sha256sum -c SHA256SUMS.txt)
          # `--generate-notes` returns HTTP 422 Releases::ConfigurationError on this repository — it
          # builds notes from merged pull requests, and every commit here was pushed directly to
          # master, so there is nothing for it to categorise. The changelog is the better body
          # anyway: it is written for a reader and already reviewed, and its section for this exact
          # version is what a release page should show.
          {
            printf 'necropsy %s\n\n' "$VERSION"
            awk -v v="$VERSION" '/^## /{p = ($0 ~ "^## " v)} p' CHANGELOG.md | tail -n +2
            printf '\n## Verifying an asset\n\nsha256sum -c SHA256SUMS.txt, or run `necropsy --build-info`\nand check the version, `schema_version`, `os` and `arch` against the asset name.\n'
          } > /tmp/notes.md
          if [ "$(wc -c < /tmp/notes.md)" -lt 200 ]; then
            echo "::error::the changelog section for $VERSION came out empty; refusing to publish a release with no description"
            exit 1
          fi
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease);; esac
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md \
            "${flags[@]}" assets/*.tar.gz assets/*.tgz assets/SHA256SUMS.txt
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets \
            --jq '"released " + .tagName + " draft=" + (.isDraft|tostring) + " prerelease=" + (.isPrerelease|tostring) + " assets=" + (.assets|length|tostring)'
