[package]
name = "necropsy"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Post-transaction forensics for EVM: reconstruct the call tree and rank where value ended up"
license = "MIT"
repository = "https://github.com/0xCyrildev/necropsy"
readme = "README.md"
keywords = ["ethereum", "forensics", "evm", "incident-response"]
categories = ["command-line-utilities"]

[[bin]]
name = "necropsy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "error-context"] }
hex = "0.4.3"
ruint = { version = "1.20.1", default-features = false, features = ["std", "alloc", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls", "gzip"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
