[package]
name = "necropsy"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Post-transaction forensics for EVM: reconstruct the call tree and rank where value ended up"
license = "MIT"
repository = "https://github.com/0xCyrildev/necropsy"
readme = "README.md"
keywords = ["ethereum", "forensics", "evm", "incident-response"]
categories = ["command-line-utilities"]
# A whitelist, not an exclude list. The repository also holds the npm packages, the packaging
# scripts and the CI workflows, and none of them belong in a crate tarball — but the real reason to
# list what ships is that `cargo publish` verifies the package it built *compiles on its own*. If a
# source file were missing from that set, the publish would fail loudly here rather than quietly
# handing someone a crate that cannot build.
include = [
  "src/**",
  "tests/fixtures/**",
  "tests/*.rs",
  "examples/*.rs",
  "Cargo.lock",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
  "SECURITY.md",
]

[[bin]]
name = "necropsy"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "error-context"] }
hex = "0.4.3"
ruint = { version = "1.20.1", default-features = false, features = ["std", "alloc", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
thiserror = "2.0.21"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls", "gzip"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
